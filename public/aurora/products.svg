<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.35" stop-color="#a5f3fc"/>
      <stop offset="0.7" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#090b10" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Collector box -->
  <g filter="url(#sh)">
    <rect x="40" y="70" width="250" height="250" rx="16" fill="url(#box)"/>
    <rect x="40" y="70" width="250" height="62" rx="16" fill="url(#lid)"/>
    <rect x="40" y="116" width="250" height="16" fill="url(#lid)"/>
    <rect x="40" y="130" width="250" height="3" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="165" cy="215" r="54" fill="url(#foil)" fill-opacity="0.9"/>
    <circle cx="165" cy="215" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M131 226c14-22 25-32 34-32s20 10 34 32" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <rect x="70" y="290" width="96" height="8" rx="4" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="70" y="92" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- Booster pack -->
  <g filter="url(#sh)" transform="rotate(-8 330 190)">
    <path d="M262 64h128l-6 10 6 10-6 10 6 10v192l-6 10 6 10H262l6-10-6-10V104l6-10-6-10 6-10z" fill="url(#foil)"/>
    <rect x="268" y="104" width="116" height="190" fill="#1e1b4b" fill-opacity="0.18"/>
    <rect x="262" y="120" width="128" height="160" fill="url(#sheen)" fill-opacity="0.8"/>
    <circle cx="326" cy="190" r="30" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M308 196c7-11 13-16 18-16s11 5 18 16" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
    <rect x="286" y="250" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.7"/>
  </g>

  <!-- Holo card -->
  <g filter="url(#sh)" transform="rotate(9 430 210)">
    <rect x="372" y="104" width="136" height="190" rx="10" fill="url(#holo)"/>
    <rect x="382" y="114" width="116" height="170" rx="6" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="390" y="134" width="100" height="72" rx="4" fill="url(#art)"/>
    <path d="M404 190c12-18 22-26 30-26s18 8 30 26" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <rect x="390" y="120" width="60" height="7" rx="3.5" fill="#1e1b4b" fill-opacity="0.7"/>
    <rect x="390" y="218" width="100" height="6" rx="3" fill="#1e1b4b" fill-opacity="0.35"/>
    <rect x="390" y="232" width="80" height="6" rx="3" fill="#1e1b4b" fill-opacity="0.35"/>
    <rect x="390" y="246" width="90" height="6" rx="3" fill="#1e1b4b" fill-opacity="0.35"/>
    <rect x="372" y="104" width="136" height="190" rx="10" fill="url(#sheen)" fill-opacity="0.6"/>
  </g>
</svg>
